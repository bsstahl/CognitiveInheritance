<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title description">
  <title id="title">Cosmos DB change feed: persist first, then act</title>
  <desc id="description">An Orders container is updated in Cosmos DB. The database exposes committed changes through its managed change feed, depicted as a logical change log rather than a separate application-written table. A background consumer reads changes asynchronously and runs a downstream action.</desc>
  <defs>
    <marker id="writeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#67e8f9"/>
    </marker>
    <marker id="actionArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fcd34d"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .heading { font-size: 24px; font-weight: 600; }
      .label { font-size: 21px; }
      .small { font-size: 18px; }
      .mono { font-family: Consolas, monospace; font-size: 18px; }
    </style>
  </defs>

  <rect x="20" y="20" width="760" height="294" rx="20" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
  <text x="44" y="59" class="heading">Cosmos DB</text>

  <text x="210" y="105" text-anchor="middle" class="label" style="fill:#67e8f9">1. Update item</text>
  <rect x="50" y="124" width="310" height="154" rx="8" fill="#172033" stroke="#67e8f9" stroke-width="2"/>
  <text x="205" y="159" text-anchor="middle" class="heading">Orders container</text>
  <path d="M50 176 H360" fill="none" stroke="#52677f"/>
  <text x="74" y="209" class="mono">id: "1042"</text>
  <text x="74" y="244" class="mono">status: "Confirmed"</text>

  <path d="M360 205 H436" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#writeArrow)"/>
  <text x="596" y="105" text-anchor="middle" class="label" style="fill:#67e8f9">2. Capture committed change</text>
  <rect x="440" y="124" width="310" height="154" rx="8" fill="#122a35" stroke="#67e8f9" stroke-width="2"/>
  <text x="595" y="159" text-anchor="middle" class="heading">Change feed</text>
  <text x="595" y="195" text-anchor="middle" class="small">DB-managed change log</text>
  <path d="M466 213 H724 M466 230 H724 M466 247 H656" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>

  <path d="M595 278 V385" fill="none" stroke="#fcd34d" stroke-width="3" marker-end="url(#actionArrow)"/>
  <text x="575" y="351" text-anchor="end" class="label" style="fill:#fcd34d">3. Read changes asynchronously</text>
  <rect x="180" y="390" width="550" height="66" rx="12" fill="#302b20" stroke="#fcd34d" stroke-width="2"/>
  <text x="455" y="419" text-anchor="middle" class="heading">Background consumer</text>
  <text x="455" y="445" text-anchor="middle" class="small">Run downstream action</text>
</svg>
