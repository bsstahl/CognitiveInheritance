<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .title { font: 700 34px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Segoe UI, Arial, sans-serif; fill: #334155; }
      .label { font: 600 19px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px Segoe UI, Arial, sans-serif; fill: #334155; }
      .callout { font: 700 18px Segoe UI, Arial, sans-serif; fill: #0b132b; }
      .flow { font: 700 16px Segoe UI, Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#f8fafc"/>
  <rect x="30" y="30" width="1220" height="660" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="60" y="78" class="title">Embeddings to Workflows</text>
  <text x="60" y="108" class="subtitle">Semantics become structure, then structure drives action</text>

  <rect x="60" y="140" width="690" height="430" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="173" class="label">Embedding Space (clustered points)</text>

  <!-- Cluster A: Billing Issues -->
  <g filter="url(#shadow)">
    <circle cx="210" cy="275" r="78" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="175" cy="255" r="8" fill="#1d4ed8"/>
    <circle cx="198" cy="298" r="7" fill="#1d4ed8"/>
    <circle cx="232" cy="246" r="7" fill="#1d4ed8"/>
    <circle cx="246" cy="280" r="8" fill="#1d4ed8"/>
    <circle cx="206" cy="262" r="6" fill="#1d4ed8"/>
    <circle cx="222" cy="315" r="7" fill="#1d4ed8"/>
    <rect x="88" y="200" width="152" height="38" rx="19" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="164" y="225" text-anchor="middle" class="callout">Billing Issues</text>
    <line x1="240" y1="238" x2="274" y2="250" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Cluster B: Login Errors -->
  <g filter="url(#shadow)">
    <circle cx="420" cy="375" r="84" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="384" cy="340" r="8" fill="#15803d"/>
    <circle cx="421" cy="338" r="7" fill="#15803d"/>
    <circle cx="447" cy="359" r="8" fill="#15803d"/>
    <circle cx="406" cy="387" r="7" fill="#15803d"/>
    <circle cx="441" cy="398" r="6" fill="#15803d"/>
    <circle cx="457" cy="379" r="7" fill="#15803d"/>
    <rect x="488" y="304" width="142" height="38" rx="19" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="559" y="329" text-anchor="middle" class="callout">Login Errors</text>
    <line x1="489" y1="345" x2="460" y2="360" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Cluster C: Policy Exceptions -->
  <g filter="url(#shadow)">
    <circle cx="635" cy="260" r="74" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="607" cy="242" r="8" fill="#b45309"/>
    <circle cx="634" cy="234" r="6" fill="#b45309"/>
    <circle cx="659" cy="249" r="8" fill="#b45309"/>
    <circle cx="648" cy="280" r="7" fill="#b45309"/>
    <circle cx="622" cy="282" r="7" fill="#b45309"/>
    <circle cx="671" cy="269" r="6" fill="#b45309"/>
    <rect x="742" y="214" width="172" height="38" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="828" y="239" text-anchor="middle" class="callout">Policy Exceptions</text>
    <line x1="742" y1="253" x2="705" y2="258" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Routing + actions panel -->
  <rect x="790" y="300" width="420" height="270" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="812" y="335" class="label">Cluster -> Workflow Mapping</text>

  <rect x="820" y="355" width="360" height="52" rx="12" fill="#e0ecff" stroke="#3b82f6"/>
  <text x="835" y="387" class="small">Billing Issues -> Refund / Invoice Triage Workflow</text>

  <rect x="820" y="418" width="360" height="52" rx="12" fill="#e8fbe9" stroke="#16a34a"/>
  <text x="835" y="450" class="small">Login Errors -> Auth Recovery + Incident Workflow</text>

  <rect x="820" y="481" width="360" height="52" rx="12" fill="#fff5dd" stroke="#d97706"/>
  <text x="835" y="513" class="small">Policy Exceptions -> Escalation / Approval Workflow</text>

  <!-- Bottom pipeline flow -->
  <line x1="120" y1="620" x2="1150" y2="620" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="120" y="594" width="150" height="48" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="195" y="624" text-anchor="middle" class="flow">Embeddings</text>

  <rect x="305" y="594" width="140" height="48" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="375" y="624" text-anchor="middle" class="flow">Clusters</text>

  <rect x="480" y="594" width="120" height="48" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="540" y="624" text-anchor="middle" class="flow">Labels</text>

  <rect x="635" y="594" width="130" height="48" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="700" y="624" text-anchor="middle" class="flow">Routing</text>

  <rect x="800" y="594" width="130" height="48" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="865" y="624" text-anchor="middle" class="flow">Actions</text>

  <text x="955" y="626" class="small">automation foundation</text>
</svg>